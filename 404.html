<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engineering Guidelines</title>
  <script>
    // GitHub Pages SPA router redirection:
    // Takes the current path, strips repository base if present, and redirects to hash route.
    (function() {
      var l = window.location;
      var path = l.pathname;
      var segments = path.split('/').filter(Boolean);
      // If deployed on github.io/<repo>/, segments[0] is usually the repo name
      var repo = segments.length > 0 && segments[0] === 'engineering-guidelines' ? segments[0] : '';
      var subPath = repo ? segments.slice(1).join('/') : segments.join('/');
      
      var targetUrl = l.protocol + '//' + l.host + (repo ? '/' + repo : '') + '/#/' + (subPath ? subPath : '');
      if (l.search) targetUrl += (subPath ? '' : '') + l.search;
      l.replace(targetUrl);
    })();
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f8fafc; color:#334155;">
  <p>Redirecting to documentation...</p>
</body>
</html>
