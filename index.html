<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Software Project Engineering & AI-Agent Development Guidelines">
  <title>Engineering Guidelines</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root { color-scheme: light dark; --bg:#fff; --panel:#f7f7f8; --text:#18181b; --muted:#6b7280; --border:#e5e7eb; --accent:#2563eb; --code:#f3f4f6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111113; --panel:#18181b; --text:#f4f4f5; --muted:#a1a1aa; --border:#303036; --accent:#60a5fa; --code:#202024; } }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
    .top{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;background:var(--bg);z-index:10}
    .brand{font-weight:700}.version{margin-left:10px;color:var(--muted);font-size:12px}.menu{display:none;margin-right:12px}
    .layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 58px)}
    aside{border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--panel)}
    .search{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:16px}
    .group{margin:18px 6px 7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    nav a{display:block;padding:6px 8px;border-radius:7px;color:var(--text);line-height:1.3} nav a.active{background:var(--code);font-weight:600}
    main{width:min(920px,100%);padding:44px 54px 80px;margin:0 auto;overflow:hidden}
    article h1{font-size:2.15rem;line-height:1.15;margin-top:0} article h2{margin-top:2.2em;border-bottom:1px solid var(--border);padding-bottom:.3em}
    article h3{margin-top:1.8em} article img{max-width:100%} article table{border-collapse:collapse;width:100%;display:block;overflow:auto}
    article th,article td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
    article pre{background:var(--code);padding:16px;border-radius:10px;overflow:auto} article code{background:var(--code);padding:.15em .35em;border-radius:4px}
    article pre code{padding:0;background:none} article blockquote{border-left:3px solid var(--border);margin-left:0;padding-left:16px;color:var(--muted)}
    .loading,.error{color:var(--muted)} footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
    @media(max-width:800px){.menu{display:inline-block} .layout{display:block} aside{display:none;position:fixed;z-index:20;left:0;top:58px;width:88%;max-width:330px;height:calc(100vh - 58px)} aside.open{display:block} main{padding:30px 20px 60px}}
  </style>
</head>
<body>
<header class="top"><button class="menu" id="menu">☰</button><span class="brand">Engineering Guidelines</span><span class="version">v1.1</span></header>
<div class="layout">
  <aside id="sidebar"><input class="search" id="search" placeholder="Filter documentation…" aria-label="Filter documentation"><nav id="nav"></nav></aside>
  <main><article id="content"><p class="loading">Loading documentation…</p></article><footer>Software Project Engineering & AI-Agent Development Standard · v1.1</footer></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
const navEl=document.getElementById('nav'), contentEl=document.getElementById('content'), sidebar=document.getElementById('sidebar');
let NAV=[];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function current(){return decodeURIComponent(location.hash.replace(/^#\/?/,'')||'README.md')}
function renderNav(filter=''){
  const q=filter.toLowerCase(); let out='';
  for(const g of NAV){
    const its=g.items.filter(i=>!q||i.title.toLowerCase().includes(q)||i.path.toLowerCase().includes(q));
    if(!its.length) continue;
    out+=`<div class="group">${esc(g.group)}</div>`;
    for(const i of its) out+=`<a data-path="${esc(i.path)}" href="#/${encodeURI(i.path)}">${esc(i.title)}</a>`;
  }
  navEl.innerHTML=out; highlight();
}
function highlight(){const p=current(); document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.path===p))}
async function load(){
  const p=current(); highlight(); sidebar.classList.remove('open');
  try{
    const r=await fetch('content/'+p); if(!r.ok) throw new Error('Document not found');
    const md=await r.text();
    marked.setOptions({gfm:true,breaks:false});
    contentEl.innerHTML=DOMPurify.sanitize(marked.parse(md));
    document.title=(contentEl.querySelector('h1')?.textContent||'Engineering Guidelines')+' · Guidelines';
    window.scrollTo(0,0);
  }catch(e){contentEl.innerHTML=`<h1>Document unavailable</h1><p class="error">${esc(e.message)}</p>`}
}
fetch('nav.json').then(r=>r.json()).then(n=>{NAV=n;renderNav();load()});
window.addEventListener('hashchange',load);
document.getElementById('search').addEventListener('input',e=>renderNav(e.target.value));
document.getElementById('menu').addEventListener('click',()=>sidebar.classList.toggle('open'));
</script>
</body></html>
